# Every night: refresh prices and news, and commit data/market.json if it changed (Vercel then redeploys).
name: Market data
on:
  schedule:
    - cron: "0 7 * * *" # 3am New York time
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run market-data
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "Update market data" && git push)
